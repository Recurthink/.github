name: Release tooling tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Type de version (auto = selon les commits)
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      suffix:
        description: Suffixe optionnel (vide = stable)
        type: string
        default: ''
      dry-run:
        description: Simulation, sans création de tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix release --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix release
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      tooling-ref: ${{ github.sha }}
      bump: ${{ inputs.bump || 'auto' }}
      suffix: ${{ inputs.suffix || '' }}
      dry-run: ${{ inputs.dry-run || false }}
